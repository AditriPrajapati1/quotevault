services:
  mongo:
    image: mongo:latest
    container_name: quotevault-mongo
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: quotevault-server
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/quotevault
      PORT: 4000

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: quotevault-client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data: