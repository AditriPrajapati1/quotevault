services:
  nginx:
    image: nginx:alpine
    container_name: qv-lb-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on: [api1, api2, api3]

  api1: &api
    image: aditri1211111/quotevault-server:latest
    environment:
      - MONGO_URI=mongodb://qv-mongo:27017/quotevault
      - INSTANCE_ID=api1
    depends_on: [mongo]

  api2:
    <<: *api
    environment:
      - MONGO_URI=mongodb://qv-mongo:27017/quotevault
      - INSTANCE_ID=api2

  api3:
    <<: *api
    environment:
      - MONGO_URI=mongodb://qv-mongo:27017/quotevault
      - INSTANCE_ID=api3

  mongo:
    image: mongo:latest
    container_name: qv-mongo
    volumes:
      - qv-mongo-data:/data/db

volumes:
  qv-mongo-data: